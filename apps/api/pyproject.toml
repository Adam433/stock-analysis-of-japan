[project]
name = "stockanalyse-api"
version = "0.1.0"
description = "Backend service for stockAnalyse"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
  "SQLAlchemy==2.0.48",
  "alembic==1.18.4",
  "fastapi==0.118.2",
  "uvicorn==0.37.0",
  "openpyxl==3.1.5",
  "xlrd==2.0.1",
  "certifi>=2024.2.2",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.uv]
package = true

[tool.hatch.build.targets.wheel]
packages = ["src/stockanalyse_api"]
